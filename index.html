<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Paletteburg</title>
</head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
    * {
        font-family: 'Press Start 2P', cursive;
    }

    html,
    body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background-color: black;
    }

    #game {
        position: fixed;
        inset: 0;
    }

    canvas {
        display: block;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
    }

    #userInterface {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 1024px;
        height: 576px;
        transform: translate(-50%, -50%) scale(var(--battle-scale, 1));
    }

    h1 {
        margin: 0;
    }

    button {
        border: 0;
        cursor: pointer;
        font-size: 16px;
    }

    button:hover {
        background-color: #ddd;
    }

    .blink {
  animation: blink 1s steps(2, start) infinite;
    }

    @keyframes blink {
    to { visibility: hidden; }
    }
</style>

<body>

    <div id="game">
        <!--start game screem-->
        <div id="startScreen" style="
            position: absolute; inset: 0; z-index: 20;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: rgba(0, 0, 0, 0.7); color: white; cursor: pointer;">
            <h1 style="font-size: 32px; margin-bottom: 24px;">Paletteburg</h1>
            <p class="blink" style="font-size: 14px;">Press any key or click to start</p>
        </div>

        <div id="overlappingDiv" style="
            background-color: black;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            position: absolute;
            opacity: 0;
            pointer-events: none;
            z-index: 10;
            ">
        </div>

        <canvas></canvas>

        <div id="userInterface" style="display: none;">
            <!-- represents health bar of dragul enemy -->
            <div style="
        background-color: white;
        width: 250px;
        position: absolute;
        top: 50px;
        left: 50px;
        border: 4px black solid;
        border-radius: 10px;
        padding: 12px;
        ">
                <h1 style="font-size: 16px;">Dragul</h1>
                <div style="position: relative;">
                    <div style="height: 5px; background-color: #ccc; margin-top: 10px; border-radius: 10px;"></div>
                    <div id="enemyHealthBar"
                        style="height: 5px; background-color: green; position: absolute; top: 0; left: 0; right: 0; border-radius: 10px;">
                    </div>
                </div>
            </div>

            <!-- represents health bar of emble us -->
            <div style="
        background-color: white;
        width: 250px;
        position: absolute;
        top: 330px;
        right: 50px;
        border: 4px black solid;
        border-radius: 10px;
        padding: 12px;
        ">
                <h1 style="font-size: 16px;">Emble</h1>
                <div style="position: relative;">
                    <div style="height: 5px; background-color: #ccc; margin-top: 10px; border-radius: 10px;"></div>
                    <div id="playerHealthBar"
                        style="height: 5px; background-color: green; position: absolute; top: 0; left: 0; right: 0; border-radius: 10px;">
                    </div>
                </div>
            </div>

            <div style="
        background-color: white;
        height: 140px;
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        border-top: 4px black solid;
        display: flex;
        ">
                <div id="dialogueBox" style="
            position: absolute; 
            top: 0; 
            right: 0; 
            bottom: 0; 
            left: 0; 
            background-color: white;
            padding: 12px;
            display: none;
            cursor: pointer;
            ">sdvzsdv
                </div>
                <div id="attacksBox" style="
            width: 66.66%; 
            display: grid; 
            grid-template-columns: repeat(2, 1fr);
            ">
                </div>
                <div style="
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    width: 33.33%;
                    border-left: 4px black solid;
                    ">

                    <h1 id="attackType" style="font-size: 16px;">Attack Type</h1>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.4/howler.min.js"
        integrity="sha512-xi/RZRIF/S0hJ+yJJYuZ5yk6/8pCiRlEXZzoguSMl+vk2i3m6UjUO/WcZ11blRL/O+rnj94JRGwt/CHbc9+6EA=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/gsap.min.js"
        integrity="sha512-H6cPm97FAsgIKmlBA4s774vqoN24V5gSQL4yBTDOY2su2DeXZVhQPxFK4P6GPdnZqM9fg1G3cMv5wD7e6cFLZQ=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="data/audio.js"></script>
    <script src="data/battleZones.js"></script>
    <script src="data/collisions.js"></script>
    <script src="data/attacks.js"></script>
    <script src="data/monsters.js"></script>
    <script src="classes.js"></script>
    <script src="index.js"></script>
    <script src="battleScene.js"></script>

</body>

</html>
